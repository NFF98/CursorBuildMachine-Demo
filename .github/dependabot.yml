version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      test-tooling:
        patterns:
          - "vitest"
          - "@playwright/test"
          - "@axe-core/playwright"
      lint-tooling:
        patterns:
          - "eslint"
          - "@eslint/js"
          - "typescript-eslint"
          - "@types/node"
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
