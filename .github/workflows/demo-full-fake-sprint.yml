name: Demo Full Fake Sprint E2E

on:
  pull_request:
    paths:
      - "demo/full-fake-sprint.mjs"
      - ".github/workflows/demo-full-fake-sprint.yml"
      - "harness/**"
      - "build-spec/**"
      - "delivery/**"
      - "releases/**"
      - "ci/**"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "demo/full-fake-sprint.mjs"
      - ".github/workflows/demo-full-fake-sprint.yml"
      - "harness/**"
      - "build-spec/**"
      - "delivery/**"
      - "releases/**"
      - "ci/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fake-sprint-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run ephemeral full Fake Sprint
        run: node demo/full-fake-sprint.mjs
